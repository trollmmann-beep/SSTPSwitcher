name: Build SSTP Switcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout switcher repository
        uses: actions/checkout@v4

      - name: Checkout Open-SSTP-Client engine
        uses: actions/checkout@v4
        with:
          repository: kittoku/Open-SSTP-Client
          ref: main
          path: upstream

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Apply SSTP Switcher profile selector
        run: python3 scripts/patch_upstream.py

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Sign APK with persistent release key
        env:
          SSTP_KEYSTORE_BASE64: ${{ secrets.SSTP_KEYSTORE_BASE64 }}
          SSTP_KEYSTORE_PASSWORD: ${{ secrets.SSTP_KEYSTORE_PASSWORD }}
          SSTP_KEY_ALIAS: ${{ secrets.SSTP_KEY_ALIAS }}
          SSTP_KEY_PASSWORD: ${{ secrets.SSTP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SSTP_KEYSTORE_BASE64" ] || [ -z "$SSTP_KEYSTORE_PASSWORD" ] || [ -z "$SSTP_KEY_ALIAS" ] || [ -z "$SSTP_KEY_PASSWORD" ]; then
            echo "::error::Persistent signing key is not configured. Add SSTP_KEYSTORE_BASE64, SSTP_KEYSTORE_PASSWORD, SSTP_KEY_ALIAS, and SSTP_KEY_PASSWORD under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$SSTP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sstpswitcher-signing.jks"
          APK_PATH="upstream/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/sstpswitcher-signing.jks" \
            --ks-key-alias "$SSTP_KEY_ALIAS" \
            --ks-pass env:SSTP_KEYSTORE_PASSWORD \
            --key-pass env:SSTP_KEY_PASSWORD \
            --out "$RUNNER_TEMP/app-signed.apk" \
            "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/app-signed.apk"
          mv "$RUNNER_TEMP/app-signed.apk" "$APK_PATH"
          rm -f "$RUNNER_TEMP/sstpswitcher-signing.jks"

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SSTPSwitcher-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SSTP Switcher APK build ${{ github.run_number }}
          body: Signed with the persistent SSTP Switcher release key. Check the Actions run for build logs.
          make_latest: true
          overwrite_files: true
          files: upstream/app/build/outputs/apk/debug/*.apk
