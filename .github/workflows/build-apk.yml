name: Build SSTP Switcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout switcher repository
        uses: actions/checkout@v4

      - name: Checkout Open-SSTP-Client engine
        uses: actions/checkout@v4
        with:
          repository: kittoku/Open-SSTP-Client
          ref: main
          path: upstream

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Apply SSTP Switcher profile selector
        run: python3 scripts/patch_upstream.py

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SSTPSwitcher-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SSTP Switcher APK build ${{ github.run_number }}
          body: Debug APK built from the current main branch. Persistent signing will be configured later.
          make_latest: true
          overwrite_files: true
          files: upstream/app/build/outputs/apk/debug/*.apk
