name: Build SSTP Switcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout switcher repository
        uses: actions/checkout@v4

      - name: Checkout Open-SSTP-Client engine
        uses: actions/checkout@v4
        with:
          repository: kittoku/Open-SSTP-Client
          ref: main
          path: upstream

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply app branding
        working-directory: upstream
        run: sed -i 's#<string name="app_name">Open SSTP Client</string>#<string name="app_name">SSTP Switcher</string>#' app/src/main/res/values/strings.xml

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SSTPSwitcher-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
